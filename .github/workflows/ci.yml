name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Lint (fails on unused imports/vars)
        run: bun run lint
      - name: Typecheck (noUnusedLocals / noUnusedParameters)
        run: bun run typecheck
      - name: Knip (unused files, exports, deps)
        run: bun run knip
      - name: Build
        run: bun run build
